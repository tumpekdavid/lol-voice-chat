[project]
name = "lol-voice-chat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "N",        # pep8-naming
    "UP",       # pyupgrade — modern `list[str]` over `List[str]`
    "ANN",      # flake8-annotations — type hints always
    "D",        # pydocstyle — docstrings on public functions
]
ignore = [
    "D100",     # module docstring not required
    "D104",     # package docstring not required
    "D107",     # __init__ docstring not required; document the class
    "ANN401",   # `Any` is allowed where it is genuinely the right type
]

[tool.ruff.lint.pydocstyle]
# Google convention, but we only want the one-line summary — the Args/Returns
# section rules (D417 et al.) are off by default under this convention.
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "data_pipeline"]
addopts = "--doctest-modules"
